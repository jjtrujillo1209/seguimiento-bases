<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Follow up outbound</title>
<link rel="stylesheet" href="/static/platzi-tokens.css">
<script>
  // Sinapsis es oscuro primero; el modo claro solo si la persona lo elige (se recuerda en este navegador)
  try { if (localStorage.getItem('fuo-tema') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
</script>
<style>
  /* Follow up outbound · Platzi Sinapsis v1.1 (oscuro primero). Tokens en /static/platzi-tokens.css;
     componentes según el design system: Button, Chip, Tabs, DataTable, Tag, Card, SidePanel, Embudo. */
  *{box-sizing:border-box}
  body{margin:0;background:var(--surface);color:var(--on-surface);font-family:var(--font-body);font-size:14px;line-height:24px;letter-spacing:.15px;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  ::selection{background:color-mix(in srgb,var(--primary) 30%,transparent)}
  .wrap{max-width:1320px;margin:0 auto;padding:0 24px 80px}
  .ms{font-family:'Material Symbols Rounded';font-size:20px;line-height:1;font-weight:400;font-variation-settings:'FILL' 0,'wght' 400;user-select:none;flex-shrink:0}

  /* estados de la empresa y etapas del contacto: roles semánticos de Sinapsis (nunca add-on en producto) */
  :root{
    --e-no_en_hubspot:var(--outline);
    --e-sin_tocar:var(--error);
    --e-contactada:var(--info);
    --e-respondio:var(--warning);
    --e-reunion:var(--organizer);
    --e-deal:var(--primary);
    --n-no_en_hubspot:var(--error);
    --n-contacto:var(--outline);
    --n-prospecto:var(--info);
    --n-lead:var(--warning);
    --n-deal:var(--primary);
    --n-actividad:var(--info);
    --n-brecha:var(--error);
  }

  /* encabezado */
  header{border-bottom:1px solid var(--outline-variant);background:var(--surface);position:sticky;top:0;z-index:5}
  header .wrap{display:flex;align-items:center;gap:16px;padding-top:16px;padding-bottom:16px;flex-wrap:wrap}
  .marca{display:flex;align-items:center;gap:16px}
  .marca svg{height:22px;width:auto;color:var(--on-surface)}
  .marca svg .cls-1{fill:currentColor}
  .marca svg .cls-2{fill:var(--primary)}
  .marca .sep{width:1px;height:32px;background:var(--outline-variant)}
  h1{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:32px;letter-spacing:-.2px;margin:0}
  .sub{color:var(--on-surface-variant);font-size:12px;line-height:16px;letter-spacing:.4px}
  .grow{flex:1}
  .progreso{font-size:12px;line-height:16px;color:var(--on-surface-variant);font-family:var(--font-mono)}

  /* Button · pastilla 36px; primary físico (sube 1px, se asienta 2px); outlined y plain con capa de estado */
  .btn{height:36px;padding:0 16px;border-radius:var(--radius-full);display:inline-flex;align-items:center;justify-content:center;gap:8px;
       font-size:14px;line-height:20px;letter-spacing:.1px;font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;
       background:transparent;color:var(--on-surface);border:1px solid var(--outline);
       transition:background-color 180ms ease,filter 180ms ease,transform 180ms cubic-bezier(.16,1,.3,1)}
  .btn:hover:not(:disabled){background:var(--state-hover)}
  .btn:active:not(:disabled){background:var(--state-pressed)}
  .btn.prim{background:var(--primary);color:var(--on-primary);border-color:transparent}
  .btn.prim:hover:not(:disabled){background:var(--primary);filter:brightness(1.08);transform:translateY(-1px)}
  .btn.prim:active:not(:disabled){transform:translateY(2px);filter:brightness(.92)}
  .btn.icono{width:36px;padding:0;border-color:transparent}
  .btn:disabled{opacity:.38;cursor:not-allowed}
  .error{background:var(--error-container);color:var(--on-error-container);padding:12px 16px;border-radius:var(--radius-xl);margin-top:16px}

  /* filtros */
  .filtros{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:20px 0 4px}
  .etq{font-size:12px;line-height:16px;letter-spacing:.3px;font-weight:600;color:var(--on-surface-variant);min-width:72px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  /* Chip filter · 32px, borde outline; seleccionado = secondary-container con ✓ */
  .chip{height:32px;padding:0 12px;border:1px solid var(--outline);border-radius:var(--radius-full);background:transparent;
        color:var(--on-surface-variant);display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;
        font-size:12px;line-height:16px;letter-spacing:.3px;font-weight:600;transition:background-color 140ms ease,color 140ms ease}
  .chip:hover{background:var(--state-hover);color:var(--on-surface)}
  .chip:active{background:var(--state-pressed)}
  .chip.on{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent}
  .chip .ms{font-size:18px}
  .chip .n{font-family:var(--font-mono);font-weight:500;opacity:.8}
  /* campos · radio xl (12px), variante soft */
  select,input[type=search]{height:40px;border:1px solid var(--outline-variant);background:var(--surf-cont);color:var(--on-surface);
        border-radius:var(--radius-xl);padding:0 12px;font-size:14px;transition:border-color 140ms ease,background-color 140ms ease}
  select:hover,input[type=search]:hover{background:var(--surf-cont-high);border-color:var(--outline)}
  select:focus,input[type=search]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 13%,transparent)}
  input[type=search]{min-width:240px}
  label.tog{display:inline-flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
  label.tog input{width:18px;height:18px;accent-color:var(--primary)}

  /* Tabs · 48px, label-lg, seleccionado en primario con indicador de 2px */
  .tabs{display:flex;gap:4px;margin:24px 0 8px;border-bottom:1px solid var(--outline-variant);overflow-x:auto}
  .tab{height:48px;padding:0 16px;border:0;border-radius:6px 6px 0 0;background:transparent;cursor:pointer;position:relative;
       display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-size:14px;line-height:20px;letter-spacing:.1px;font-weight:600;
       color:var(--on-surface-variant);transition:color 140ms ease,background-color 140ms ease}
  .tab:hover{color:var(--on-surface);background:var(--state-hover)}
  .tab:active{background:var(--state-pressed)}
  .tab:focus-visible{outline-offset:-2px}
  .tab.on{color:var(--primary)}
  .tab.on::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:var(--radius-full);background:var(--primary)}

  /* títulos de sección · title-lg */
  h2{font-family:var(--font-display);font-size:20px;line-height:28px;font-weight:600;margin:32px 0 12px}
  h2 .sub{font-family:var(--font-body);font-weight:400;margin-left:8px}

  /* Card elevated (KPIs, tarjetas de segmento, gráficas) */
  .card{background:var(--surf-cont-low);border-radius:var(--radius-3xl);padding:24px;position:relative;
        box-shadow:0 1px 2px 0 color-mix(in srgb,var(--shadow) 30%,transparent),0 1px 3px 1px color-mix(in srgb,var(--shadow) 15%,transparent)}
  .clic{cursor:pointer}
  .clic::after{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--on-surface);opacity:0;transition:opacity 140ms ease;pointer-events:none}
  .clic:hover::after{opacity:.08}
  .clic:active::after{opacity:.16}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-top:12px}
  .kpi{background:var(--surf-cont-low);border-radius:var(--radius-3xl);padding:20px 24px;display:flex;flex-direction:column;gap:4px;position:relative;
       box-shadow:0 1px 2px 0 color-mix(in srgb,var(--shadow) 30%,transparent),0 1px 3px 1px color-mix(in srgb,var(--shadow) 15%,transparent)}
  .kpi .ico{color:var(--primary);font-size:24px}
  .kpi .v{font-family:var(--font-display);font-size:32px;line-height:40px;letter-spacing:-.4px;font-weight:700}
  .kpi .l{font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--on-surface-variant)}
  .kpi .p{font-size:12px;line-height:16px;color:var(--on-surface-variant);font-family:var(--font-mono)}
  .kpi.clic{cursor:pointer}
  .kpi .dot,.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .etapas{display:flex;flex-wrap:wrap;gap:4px}
  .etapa{font-size:12px;line-height:16px;padding:2px 8px;border-radius:var(--radius-sm);background:var(--surf-cont-high);color:var(--on-surface-variant);white-space:nowrap}
  .etapa b{font-family:var(--font-mono);margin-left:4px;color:var(--on-surface)}
  details.rep{border-bottom:1px solid var(--outline-variant)}
  details.rep summary{cursor:pointer;padding:12px 0;display:grid;grid-template-columns:minmax(140px,200px) 56px 1fr;gap:12px;align-items:center;list-style:none}
  details.rep summary::-webkit-details-marker{display:none}
  details.rep[open] summary{font-weight:600}
  .seccion{background:var(--surf-cont-low);border-radius:var(--radius-3xl);padding:8px 20px 12px;margin-top:16px}
  .seccion h5{font-family:var(--font-display);font-size:16px;line-height:24px;font-weight:600;margin:12px 0 2px}

  /* DataTable · contenedor surface-container-low, franja de cabecera, sentence case */
  .scroll{overflow:auto;background:var(--surf-cont-low);border:1px solid var(--outline-variant);border-radius:var(--radius-lg);max-height:72vh;
          scrollbar-width:thin;scrollbar-color:var(--outline) transparent}
  .tabla{width:100%;border-collapse:collapse}
  .tabla th{text-align:left;font-size:12px;line-height:16px;letter-spacing:.3px;font-weight:400;color:var(--on-surface-variant);
            padding:12px 16px;border-bottom:1px solid var(--outline-variant);white-space:nowrap;cursor:pointer;user-select:none;
            position:sticky;top:0;background:var(--surf-cont);z-index:1}
  .tabla th:hover{color:var(--on-surface)}
  .tabla td{padding:12px 16px;border-bottom:1px solid var(--outline-variant);vertical-align:middle;font-size:14px;line-height:24px}
  .tabla tbody tr:last-child td{border-bottom:none}
  .tabla tr.fila{cursor:pointer;transition:background-color 120ms ease}
  .tabla tr.fila:hover td{background:var(--state-hover)}
  .tabla tr.sel td{background:var(--state-focus)}
  .tabla tr.grupo td{background:var(--surf-cont-high);font-family:var(--font-display);font-weight:600;font-size:14px;line-height:20px;padding:8px 16px}
  .tabla tr.sub-grupo td{background:var(--surf-cont);padding:8px 16px}
  .tabla td:first-child{min-width:190px}
  /* Secuencias: detalle del progreso por etapa al abrir una fila */
  .sec-flecha{font-size:18px;vertical-align:-4px;margin:0 4px 0 -6px;color:var(--on-surface-variant)}
  .tabla tr.sec-detalle>td{background:var(--surf-cont);padding:16px 16px 16px 36px}
  .etapas-caja{display:inline-block;max-width:100%;overflow:auto;background:var(--surf-cont-low);border:1px solid var(--outline-variant);border-radius:var(--radius-md)}
  .tabla.sec-etapas{width:auto}
  .tabla.sec-etapas th{position:static;cursor:default;background:transparent}
  .tabla.sec-etapas td{padding:8px 16px}
  .tabla.sec-etapas td:first-child{min-width:0}
  .sec-activa{display:flex;align-items:center;gap:6px;font-size:13px;line-height:20px;min-width:220px;max-width:280px;overflow-wrap:anywhere}
  .sec-activa .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .etapa-tipo{display:inline-flex;align-items:center;gap:8px}
  .etapa-tipo .ms{font-size:18px;color:var(--primary)}
  .num,.tabla th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .muted{color:var(--on-surface-variant)}
  .mono{font-family:var(--font-mono);font-size:12px}
  .nombre{font-weight:600}
  .dom{font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--on-surface-variant)}
  .small{font-size:12px;line-height:16px}

  /* barra de distribución: segmentos separados por 2px de superficie */
  .barra{display:flex;gap:2px;height:8px;border-radius:var(--radius-full);overflow:hidden;min-width:160px;background:var(--surf-cont-high)}
  .barra span{display:block;height:100%}
  .barra span[style*="width:0%"]{display:none}
  .estado{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:16px;font-weight:600;white-space:nowrap}
  .estado::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
  .alerta{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 8px;border-radius:var(--radius-sm);
          background:var(--warning-container);color:var(--on-warning-container);font-size:12px;font-weight:600}
  .tarde{color:var(--error);font-weight:600}
  .leyenda{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--on-surface-variant);margin-top:12px}

  /* Tag · radio 6px, colores semánticos soft */
  .tag{display:inline-flex;align-items:center;gap:4px;border-radius:var(--radius-sm);padding:2px 8px;font-size:12px;line-height:16px;
       letter-spacing:.3px;font-weight:600;white-space:nowrap;background:var(--surf-cont-high);color:var(--on-surface-variant);margin-left:4px;vertical-align:1px}
  .tag.seg,.tag.ok{background:var(--success-container);color:var(--on-success-container);margin-left:0}
  .tag.seg.sin{background:var(--surf-cont-high);color:var(--on-surface-variant)}
  .tag.prim{background:var(--primary-container);color:var(--on-primary-container)}
  .tag.warn{background:var(--warning-container);color:var(--on-warning-container)}
  .tag.err{background:var(--error-container);color:var(--on-error-container)}
  .tag.info{background:var(--info-container);color:var(--on-info-container)}
  .cadena{display:inline-flex;gap:4px;flex-wrap:wrap}
  .paso{font-size:12px;line-height:16px;font-weight:600;padding:2px 8px;border-radius:var(--radius-sm);border:1px solid var(--outline-variant);
        color:var(--on-surface-variant);white-space:nowrap}
  .paso.ok{border-color:transparent;background:var(--surf-cont-highest);color:var(--on-surface)}
  .paso.ok[style*="prospecto"]{background:var(--info-container);color:var(--on-info-container)}
  .paso.ok[style*="lead"]{background:var(--warning-container);color:var(--on-warning-container)}
  .paso.ok[style*="deal"]{background:var(--primary-container);color:var(--on-primary-container)}

  /* tarjetas de segmento */
  .segcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .segcard{text-align:left;border:0;background:var(--surf-cont-low);border-radius:var(--radius-3xl);padding:20px;cursor:pointer;position:relative;
           display:flex;flex-direction:column;gap:4px;color:var(--on-surface);
           box-shadow:0 1px 2px 0 color-mix(in srgb,var(--shadow) 30%,transparent),0 1px 3px 1px color-mix(in srgb,var(--shadow) 15%,transparent)}
  .segcard::after{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--on-surface);opacity:0;transition:opacity 140ms ease;pointer-events:none}
  .segcard:hover::after{opacity:.08}
  .segcard.on{box-shadow:inset 0 0 0 2px var(--primary)}
  .segcard .nombre{font-family:var(--font-display);font-size:16px;line-height:24px}
  .segnums{display:flex;flex-direction:column;gap:2px;font-size:12px;line-height:18px;margin:8px 0}
  .segcard .barra{min-width:0}


  /* validación en HubSpot: flujo de pasos + barra apilada de etapas */
  .valida{margin-top:12px;display:flex;flex-direction:column;gap:24px}
  .vflujo{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;gap:8px}
  .vpaso{position:relative;border-radius:var(--radius-xl);padding:16px;background:var(--surf-cont);display:flex;flex-direction:column;gap:2px}
  .vpaso .ico{color:var(--primary);font-size:24px;margin-bottom:4px}
  .vpaso .v{font-family:var(--font-display);font-size:32px;line-height:40px;letter-spacing:-.4px;font-weight:700}
  .vpaso .l{font-family:var(--font-display);font-size:14px;line-height:20px;font-weight:600}
  .vpaso .p{font-size:12px;line-height:16px;color:var(--on-surface-variant);min-height:16px}
  .vpista{height:8px;border-radius:var(--radius-full);background:var(--surf-cont-high);margin-top:12px;overflow:hidden}
  .vpista span{display:block;height:100%;background:var(--primary);border-radius:var(--radius-full)}
  .vconv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:96px;max-width:150px;text-align:center}
  .vconv .ms{color:var(--on-surface-variant)}
  .vconv b{font-family:var(--font-display);font-size:16px;line-height:24px}
  .vconv .tag{margin-left:0;white-space:normal;text-align:center}
  .clic-tag{cursor:pointer}
  .clic-tag:hover{filter:brightness(1.08)}
  .vetapas{border-top:1px solid var(--outline-variant);padding-top:20px;display:flex;flex-direction:column;gap:12px}
  .vetapas-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .vetapas-cab .tag{margin-left:0}
  .vapilada{display:flex;gap:2px;height:24px;border-radius:var(--radius-md);overflow:hidden}
  .vapilada span{display:block;height:100%}
  .vleyenda{display:flex;flex-wrap:wrap;gap:8px}
  .vley{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:var(--radius-full);border:1px solid var(--outline-variant);
        background:transparent;cursor:pointer;font-size:12px;line-height:16px;font-weight:600;color:var(--on-surface)}
  .vley b{font-family:var(--font-display);font-size:14px}
  .vley .dot{margin-right:0}
  .vley:hover{background:var(--state-hover)}
  .vley.cero{opacity:.6}
  @media (max-width:1000px){.vflujo{grid-template-columns:1fr}.vconv{flex-direction:row;max-width:none;min-width:0}}
  /* gráficas */
  .graficas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:12px}
  .graficas .ancha{grid-column:1 / -1}
  .card h3{font-family:var(--font-display);font-size:16px;line-height:24px;font-weight:600;margin:0}
  .card .desc{font-size:12px;line-height:16px;color:var(--on-surface-variant);margin:2px 0 16px}
  .embudo-kpis{display:grid;gap:0}
  .embudo-kpi{padding:0 16px;min-width:0}
  .embudo-kpi .v{font-family:var(--font-display);font-size:40px;line-height:48px;letter-spacing:-.25px;font-weight:700}
  .embudo-kpi .l{font-family:var(--font-display);font-size:14px;line-height:20px;font-weight:600;margin-top:8px}
  .embudo-kpi .p{font-size:12px;line-height:16px;color:var(--on-surface-variant);margin-top:4px}
  .embudo-kpi.acento .v,.embudo-kpi.acento .l{color:var(--primary)}
  .embudo-flujo{position:relative;height:120px;margin-top:16px}
  .embudo-flujo svg{display:block;width:100%;height:100%}
  .embudo-flujo .div{position:absolute;top:0;bottom:0;width:1px;background:var(--outline-variant)}
  .hbar{display:grid;grid-template-columns:minmax(120px,170px) 1fr 64px;gap:12px;align-items:center;padding:4px 0;font-size:14px;line-height:20px}
  .hbar .pista{height:20px;border-radius:0 4px 4px 0;position:relative}
  .hbar .marca-b{position:absolute;left:0;top:0;bottom:0;background:var(--primary);border-radius:0 4px 4px 0;min-width:2px}
  .hbar .marca-b.baja{background:var(--error)}
  .hbar .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .hbar:hover{background:var(--state-hover);border-radius:var(--radius-md)}
  .linea svg{display:block;width:100%;height:auto;overflow:visible}
  .linea .eje{font-size:12px;fill:var(--on-surface-variant);font-family:var(--font-body)}
  .tooltip{position:fixed;z-index:20;pointer-events:none;background:var(--inverse-surface);color:var(--inverse-on-surface);border-radius:var(--radius-md);
           padding:8px 12px;font-size:12px;line-height:16px;box-shadow:0 4px 8px color-mix(in srgb,var(--shadow) 30%,transparent);opacity:0;transition:opacity 120ms ease}
  .tooltip b{font-weight:700}

  /* SidePanel · scrim 55%, superficie surface-container, título headline-sm */
  .velo{position:fixed;inset:0;background:color-mix(in srgb,var(--scrim) 55%,transparent);z-index:9}
  aside{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--surf-cont);z-index:10;overflow:auto;padding:24px 24px 64px;
        box-shadow:0 8px 32px color-mix(in srgb,var(--shadow) 36%,transparent),0 2px 8px color-mix(in srgb,var(--shadow) 20%,transparent);
        animation:entra 220ms cubic-bezier(.16,1,.3,1)}
  @keyframes entra{from{transform:translateX(100%)}to{transform:none}}
  aside h3{font-family:var(--font-display);font-size:24px;line-height:32px;letter-spacing:-.2px;font-weight:700;margin:4px 0 2px}
  aside h4{font-family:var(--font-display);font-size:14px;line-height:20px;font-weight:600;color:var(--on-surface);margin:24px 0 8px}
  .cerrar{float:right;width:36px;height:36px;padding:0;border:0;border-radius:var(--radius-full);background:var(--surf-cont-low)}
  .cerrar:hover{background:var(--surf-cont-high)}
  .links{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
  .links a,a.enlace{color:var(--primary);font-weight:600;font-size:14px;text-decoration:none}
  .links a:hover{text-decoration:underline}
  .hitos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}

  .hito b{display:block;font-size:14px;line-height:20px}
  .hito.ok{box-shadow:inset 3px 0 0 var(--c)}
  .hito .f{color:var(--on-surface-variant);font-family:var(--font-mono);font-size:12px}
  .lst{list-style:none;margin:0;padding:0}

  .act{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:start}
  .act .d{color:var(--on-surface-variant);font-size:12px;line-height:16px;margin-top:2px}
  .vacio{background:var(--surf-cont-low);border-radius:var(--radius-3xl);padding:32px;margin-top:24px;line-height:1.7}
  .vacio code,code{font-family:var(--font-mono);background:var(--surf-cont-high);padding:2px 6px;border-radius:var(--radius-sm);font-size:12px}
  @media (max-width:900px){.graficas{grid-template-columns:1fr}}
  @media (max-width:700px){.hitos{grid-template-columns:repeat(2,1fr)} input[type=search]{min-width:0;width:100%}
    .wrap{padding:0 16px 64px} .embudo-kpi .v{font-size:28px;line-height:36px} .marca .sep,.marca .sub-marca{display:none}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
const ESTADOS = {
  no_en_hubspot: 'No está en HubSpot',
  sin_tocar: 'Sin tocar',
  contactada: 'Contactada',
  respondio: 'Respondió',
  reunion: 'Reunión',
  deal: 'Deal',
};
const ORDEN = Object.keys(ESTADOS);
const ICONO = {correo:'mail', llamada:'call', reunion:'event', mensaje:'chat', nota:'sticky_note_2'};
const ALERTAS = {
  owner_distinto:'Owner distinto', sin_owner:'Sin owner', cliente:'Ya es cliente', deal_previo:'Deal abierto previo',
  duplicada:'Empresa duplicada', coincidencia_aproximada:'Verificar coincidencia',
  sin_registro_hubspot:'Sin registro en HubSpot', sin_canal:'Sin canal válido', asignacion_doble:'Asignada a dos reps', contactos_faltantes:'Contactos fuera de HubSpot', toque_de_otro:'Tocada por otro owner', tratada_antes:'Tratada antes de la base',
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '—';
// porcentaje que no esconde lo pequeño: 1 de 763 es «<1%», 673 de 675 es «>99%»
const pctFino = (a, b) => { if (!b) return '—'; const r = Math.round(100 * a / b);
  return a > 0 && r === 0 ? '<1%' : a < b && r === 100 ? '>99%' : r + '%'; };
// Fechas sin hora (inicio de semana) se leen como mediodía local para no correrse un día
const aFecha = s => new Date(String(s).length === 10 ? s + 'T12:00' : s);
const fecha = s => s ? aFecha(s).toLocaleDateString('es-CO', {day:'2-digit', month:'short'}) : '—';
const fechaHora = s => s ? new Date(s).toLocaleString('es-CO', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}) : '—';
// días desde el lunes de la base (medianoche local) hasta el evento
const dias = (inicio, hasta) => Math.floor((new Date(hasta) - new Date(inicio + 'T00:00')) / 864e5);
const hsUrl = (tipo, id) => D.portal_id ? `https://app.hubspot.com/contacts/${D.portal_id}/record/${tipo}/${id}` : null;
const estadoHtml = s => `<span class="estado" style="--c:var(--e-${s})">${ESTADOS[s]}</span>`;

// En Vercel la página es una foto: datos.json e historial.json los publica la app local
// después de cada sincronización (publicar_vercel.py). Sincronizar y configurar solo existen en local.
const ESTATICO = !['127.0.0.1', 'localhost'].includes(location.hostname);
let HIST = null;

async function cargar() {
  D = await (await fetch(ESTATICO ? '/datos.json' : '/api/datos', {cache: 'no-store'})).json();
  if (ESTATICO) PROGRAMACION = D.programacion ?? null;
  $('#generado').textContent = (D.generado ? 'Última sincronización: ' + fechaHora(D.generado) : 'Sin sincronizar todavía')
    + (PROGRAMACION ? ' · ' + PROGRAMACION : '');
  const semanas = [...new Set(D.bases.map(b => b.semana_clave))];
  if (!semanas.includes(F.semana)) F.semana = semanas[0] || null;
  pintar();
}

let D = {bases: []};
const F = {semana: null, segmento: '', lider: '', rep: '', vista: 'resumen', estado: '', q: '', alertas: false,
           nivel: '', brechas: false, trabajados: false, orden: 'estado', dir: 1};

// Segmentos y equipo: equipo.json (seller → segmento, equipo, región, líder)
const SEG_BASE = {smb: 'SMB', mid_market: 'Mid Market', corporate: 'Corporate', gobierno: 'Gobierno', sdr_ent: 'SDR ENT'};
const segmentos = () => ({...SEG_BASE, ...(D.segmentos || {})});
const segNombre = s => segmentos()[s] || 'Sin segmento';
const segHtml = s => `<span class="tag seg ${segmentos()[s] ? '' : 'sin'}">${esc(segNombre(s))}</span>`;
const ordenSeg = s => { const i = Object.keys(segmentos()).indexOf(s); return i < 0 ? 99 : i; };

// Tratamiento de cada contacto en HubSpot (sincronizar.py · _tratamiento_contacto)
const NIVELES = ['no_en_hubspot', 'contacto', 'prospecto', 'lead', 'deal'];
const NIVEL_TXT = {no_en_hubspot: 'No está en HubSpot', contacto: 'Contacto', prospecto: 'Prospecto', lead: 'Lead', deal: 'Deal'};
const BRECHAS = {no_en_hubspot: 'No existe en HubSpot', sin_actividad: 'Sin actividad en HubSpot', sin_avance: 'Respondió y no avanzó'};
const ESTADO_SEC = {active: 'Activa', draft: 'Borrador', paused: 'Pausada', archived: 'Archivada', completed: 'Terminada'};

function equipo() {
  const lista = (D.equipo || []).map(s => ({...s}));
  const vistos = new Set(lista.map(s => s.email));
  for (const b of D.bases) {
    const e = (b.rep_email || '').toLowerCase();
    if (e && !vistos.has(e)) {
      vistos.add(e);
      lista.push({email: e, nombre: b.rep_nombre || e, segmento: b.segmento || 'sin_segmento', equipo: null, region: null, lider: null});
    }
  }
  return lista.sort((a, b) => ordenSeg(a.segmento) - ordenSeg(b.segmento) || a.nombre.localeCompare(b.nombre));
}
const pasaFiltro = s => (!F.segmento || (s.segmento || 'sin_segmento') === F.segmento) && (!F.lider || s.lider === F.lider)
  && (!F.rep || s.email === F.rep);
const sellersFiltrados = () => equipo().filter(pasaFiltro);

function basesDeLaSemana() {
  return D.bases.filter(b => b.semana_clave === F.semana);
}

// Bases de la semana de los sellers que pasan el filtro: alimentan KPIs, contactos, empresas, desglose y CSV
function basesSemana() {
  const ok = new Set(sellersFiltrados().map(s => s.email));
  return basesDeLaSemana().filter(b => ok.has((b.rep_email || '').toLowerCase()));
}

// Las suyas y las compartidas donde tiene leads (p. ej. Chile y DAPTA para los SDR)
function secuenciasDe(email) {
  return (D.secuencias || []).filter(s => s.rep === email || (s.reps || []).includes(email));
}

function sumarContactos(bs) {
  const t = {total: 0, trabajados: 0, respondieron: 0, en_hubspot: 0, trabajados_en_hs: 0, con_actividad: 0,
             con_brechas: 0, por_nivel: {}, brechas: {}};
  for (const b of bs) {
    const c = b.resumen?.contactos_hs;
    if (!c) continue;
    for (const k of Object.keys(t)) {
      if (k === 'por_nivel' || k === 'brechas') for (const [x, n] of Object.entries(c[k] || {})) t[k][x] = (t[k][x] || 0) + n;
      else t[k] += c[k] || 0;
    }
  }
  return t;
}

function barraNiveles(c) {
  const n = c.total || 1;
  return `<div class="barra" title="${NIVELES.map(s => `${NIVEL_TXT[s]}: ${c.por_nivel[s] || 0}`).join(' · ')}">${
    [...NIVELES].reverse().map(s => `<span style="width:${100 * (c.por_nivel[s] || 0) / n}%;background:var(--n-${s})"></span>`).join('')}</div>`;
}

function pintar() {
  const c = $('#contenido');
  if (!D.bases.length && !(D.secuencias || []).length) {
    c.innerHTML = `<div class="vacio">
      <b>Todavía no hay bases.</b><br>
      Las secuencias que crean los sellers de <code>equipo.json</code> se siguen solas; las demás se marcan en <b>Secuencias</b>.
      Pulsa <b>Sincronizar</b>. Para leer los leads hace falta el Chrome dedicado con sesión en Amplemarket.
      ${avisosHtml()}</div>`;
    return;
  }
  const semanas = [...new Set(D.bases.map(b => b.semana_clave))];
  const todos = equipo();
  const nSeg = s => todos.filter(x => (x.segmento || 'sin_segmento') === s).length;
  const segChips = [['', 'Todos los segmentos', todos.length], ...Object.entries(segmentos()).map(([k, l]) => [k, l, nSeg(k)]),
    ...(nSeg('sin_segmento') ? [['sin_segmento', 'Sin segmento', nSeg('sin_segmento')]] : [])];
  const enSeg = todos.filter(s => !F.segmento || (s.segmento || 'sin_segmento') === F.segmento);
  const lideres = [...new Set(enSeg.map(s => s.lider).filter(Boolean))].sort();
  const reps = enSeg.filter(s => !F.lider || s.lider === F.lider);
  const vistas = [['resumen', 'Resumen', 'dashboard'], ['secuencias', 'Secuencias', 'route'],
                  ['contactos', 'Contactos en HubSpot', 'fact_check'], ['empresas', 'Empresas', 'apartment']];

  c.innerHTML = `
    <div class="filtros">
      <span class="etq">Semana</span>
      <div class="chips">${semanas.map(s => {
        const b = D.bases.find(x => x.semana_clave === s);
        return `<button class="chip ${s === F.semana ? 'on' : ''}" data-semana="${s}">${s === F.semana ? '<span class="ms">check</span>' : ''}S${b.semana} · ${fecha(b.inicio)}</button>`;
      }).join('')}</div>
    </div>
    <div class="filtros" style="margin-top:10px">
      <span class="etq">Segmento</span>
      <div class="chips">${segChips.map(([k, l, n]) =>
        `<button class="chip ${F.segmento === k ? 'on' : ''}" data-segmento="${k}">${F.segmento === k ? '<span class="ms">check</span>' : ''}${esc(l)}<span class="n">${n}</span></button>`).join('')}</div>
      <select id="f-lider"><option value="">Todos los líderes</option>${lideres.map(l =>
        `<option ${F.lider === l ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
      <select id="f-rep"><option value="">Todos los sellers</option>${reps.map(s =>
        `<option value="${esc(s.email)}" ${F.rep === s.email ? 'selected' : ''}>${esc(s.nombre)}</option>`).join('')}</select>
    </div>
    <div class="tabs">${vistas.map(([k, l, i]) =>
      `<button class="tab ${F.vista === k ? 'on' : ''}" data-vista="${k}"><span class="ms">${i}</span>${l}</button>`).join('')}</div>
    <div id="vista"></div>
    ${avisosHtml()}`;

  c.querySelectorAll('[data-semana]').forEach(b => b.onclick = () => { F.semana = b.dataset.semana; pintar(); });
  c.querySelectorAll('[data-segmento]').forEach(b => b.onclick = () => { F.segmento = b.dataset.segmento; F.lider = ''; F.rep = ''; pintar(); });
  c.querySelectorAll('[data-vista]').forEach(b => b.onclick = () => { F.vista = b.dataset.vista; pintar(); });
  $('#f-lider').onchange = e => { F.lider = e.target.value; F.rep = ''; pintar(); };
  $('#f-rep').onchange = e => { F.rep = e.target.value; pintar(); };
  ({resumen: vistaResumen, secuencias: vistaSecuencias, contactos: vistaContactos, empresas: vistaEmpresas})[F.vista]();
}

const nf = new Intl.NumberFormat('es-CO');

async function cargarHistorial() {
  if (!HIST) HIST = await (await fetch(ESTATICO ? '/historial.json' : '/api/historial_todo', {cache: 'no-store'})).json();
  return HIST;

// Embudo · componente Sinapsis: fila de KPIs + flujo suavizado con degradado primario + divisores
function embudoHtml(etapas) {
  const W = 1000, H = 100, n = etapas.length, seg = W / n;
  const max = Math.max(...etapas.map(s => s.v), 1);
  const alto = etapas.map(s => Math.max((s.v / max) * H, 2));
  const pts = signo => alto.map((h, i) => [i * seg + seg / 2, (H + signo * h) / 2]);
  const curva = (p, ida) => {
    let d = '';
    for (let i = 1; i < p.length; i++) {
      const [xa, ya] = p[i - 1], [xb, yb] = p[i], mx = (xa + xb) / 2;
      d += ` C${mx},${ya} ${mx},${yb} ${xb},${yb}`;
    }
    return d;
  };
  const arriba = pts(-1), abajo = pts(1).reverse();
  const d = `M0,${arriba[0][1]} L${arriba[0][0]},${arriba[0][1]}${curva(arriba)} L${W},${arriba.at(-1)[1]}`
    + ` L${W},${abajo[0][1]} L${abajo[0][0]},${abajo[0][1]}${curva(abajo)} L0,${abajo.at(-1)[1]} Z`;
  const id = 'emb' + Math.random().toString(36).slice(2, 7);
  return `<div class="embudo-kpis" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${etapas.map((s, i) => `
      <div class="embudo-kpi ${i === n - 1 ? 'acento' : ''}">
        <div class="v">${nf.format(s.v)}</div><div class="l">${esc(s.l)}</div>
        <div class="p">${i === 0 ? '100%' : `${pct(s.v, etapas[0].v)} del total`}${s.nota ? ' · ' + esc(s.nota) : ''}</div>
      </div>`).join('')}</div>
    <div class="embudo-flujo">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
        <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" style="stop-color:var(--primary);stop-opacity:.16"></stop>
          <stop offset="70%" style="stop-color:var(--primary);stop-opacity:.45"></stop>
          <stop offset="100%" style="stop-color:var(--primary);stop-opacity:.9"></stop>
        </linearGradient></defs>
        <path d="${d}" fill="url(#${id})"></path>
      </svg>
      ${etapas.slice(1).map((_, i) => `<span class="div" style="left:${(i + 1) / n * 100}%"></span>`).join('')}
    </div>`;
}

// Barras horizontales: una fila por seller, ordenadas de mayor a menor, valor rotulado al final
function barrasHtml(filas, sinDatos) {
  if (!filas.length) return `<p class="muted">${sinDatos}</p>`;
  return filas.sort((a, b) => b.v - a.v).map(f => `
    <div class="hbar" data-tip="${esc(f.tip)}">
      <span>${esc(f.nombre)}</span>
      <div class="pista"><span class="marca-b" style="width:${Math.round(f.v * 100)}%"></span></div>
      <span class="val">${Math.round(f.v * 100)}%</span>
    </div>`).join('');
}

// Línea de avance diario: empresas contactadas acumuladas al cierre de cada día
function avanceDiario(bs, hist) {
  const claves = bs.flatMap(b => b.empresas.map(e => `${b.lista_id}|${e.clave}`));
  const dias = [...new Set(claves.flatMap(k => (hist[k] || []).map(c => c.ts.slice(0, 10))))].sort();
  const iC = ORDEN.indexOf('contactada'), iR = ORDEN.indexOf('respondio'), iM = ORDEN.indexOf('reunion');
  return dias.map(dia => {
    const t = {dia, contactadas: 0, respondieron: 0, reuniones: 0};
    for (const k of claves) {
      const cambios = (hist[k] || []).filter(c => c.ts.slice(0, 10) <= dia);
      if (!cambios.length) continue;
      const i = ORDEN.indexOf(cambios.at(-1).estado);
      t.contactadas += i >= iC; t.respondieron += i >= iR; t.reuniones += i >= iM;
    }
    return t;
  });
}

function lineaHtml(serie, ancho = 640) {
  if (serie.length < 2) return '<p class="muted">Hace falta más de un día de historial para dibujar el avance.</p>';
  const W = Math.max(Math.round(ancho), 320), H = 200, iz = 40, de = 56, ar = 12, ab = 28;
  const max = Math.max(...serie.map(s => s.contactadas), 1);
  const paso = 10 ** Math.floor(Math.log10(max)), tope = Math.ceil(max / paso) * paso;
  const x = i => iz + (W - iz - de) * (serie.length === 1 ? 0 : i / (serie.length - 1));
  const y = v => ar + (H - ar - ab) * (1 - v / tope);
  const marcas = [0, tope / 2, tope];
  const d = serie.map((s, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(s.contactadas).toFixed(1)}`).join(' ');
  const ultimo = serie.at(-1);
  return `<div class="linea"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Empresas contactadas por día">
    ${marcas.map(m => `<line x1="${iz}" x2="${W - de}" y1="${y(m)}" y2="${y(m)}" style="stroke:var(--outline-variant)" stroke-width="1"></line>
      <text class="eje" x="${iz - 8}" y="${y(m) + 4}" text-anchor="end">${nf.format(m)}</text>`).join('')}
    ${serie.map((s, i) => `<text class="eje" x="${x(i)}" y="${H - 6}" text-anchor="middle">${fecha(s.dia)}</text>`).join('')}
    <path d="${d}" fill="none" style="stroke:var(--primary)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>
    ${serie.map((s, i) => `<circle cx="${x(i)}" cy="${y(s.contactadas)}" r="4" style="fill:var(--primary);stroke:var(--surf-cont-low)" stroke-width="2"></circle>`).join('')}
    <text class="eje" x="${x(serie.length - 1) + 10}" y="${y(ultimo.contactadas) + 4}" style="fill:var(--on-surface);font-weight:600">${nf.format(ultimo.contactadas)}</text>
    ${serie.map((s, i) => {
      const ancho = (W - iz - de) / Math.max(serie.length - 1, 1);
      return `<rect x="${x(i) - ancho / 2}" y="0" width="${ancho}" height="${H - ab}" fill="transparent"
        data-tip="${esc(`${fecha(s.dia)} · ${nf.format(s.contactadas)} contactadas · ${s.respondieron} respondieron · ${s.reuniones} con reunión`)}"></rect>`;
    }).join('')}
  </svg></div>`;
}

// ── Validación en HubSpot: flujo de 4 pasos con fugas + etapa en HubSpot (barra apilada) ──
function validacionHtml(t) {
  const b = t.brechas, n = t.por_nivel;
  const pasos = [
    {ico: 'group', v: t.total, l: 'Contactos en secuencias', p: `${t.respondieron} respondieron en Amplemarket`, ir: 'todos'},
    {ico: 'send', v: t.trabajados, l: 'Trabajados en Amplemarket', p: 'con primer contacto enviado', ir: 'trabajados'},
    {ico: 'person_check', v: t.trabajados_en_hs, l: 'Existen en HubSpot', p: 'de los trabajados', ir: 'trabajados'},
    {ico: 'history', v: t.con_actividad, l: 'Con actividad en HubSpot', p: 'correo, llamada o mensaje registrado', ir: 'trabajados'},
  ];
  // fuga entre un paso y el siguiente: qué se perdió y por qué
  const fugas = [
    {txt: `${nf.format(t.total - t.trabajados)} aún sin trabajar`, tipo: '', ir: ''},
    {txt: `${nf.format(b.no_en_hubspot || 0)} no existen en HubSpot`, tipo: b.no_en_hubspot ? 'err' : 'ok', ir: 'brechas'},
    {txt: `${nf.format(b.sin_actividad || 0)} sin actividad registrada`, tipo: b.sin_actividad ? 'warn' : 'ok', ir: 'brechas'},
  ];
  const max = Math.max(t.total, 1);
  const flujo = pasos.map((s, i) => `
    ${i ? `<div class="vconv">
        <span class="ms">arrow_forward</span>
        <b>${pctFino(s.v, pasos[i - 1].v)}</b>
        <span class="tag ${fugas[i - 1].tipo} ${fugas[i - 1].ir ? 'clic-tag' : ''}" ${fugas[i - 1].ir ? `data-ir="${fugas[i - 1].ir}"` : ''}>${esc(fugas[i - 1].txt)}</span>
      </div>` : ''}
    <div class="vpaso clic" data-ir="${s.ir}" data-tip="${esc(`${s.l}: ${nf.format(s.v)} · ${pct(s.v, t.total)} del total`)}">
      <span class="ms ico">${s.ico}</span>
      <div class="v">${nf.format(s.v)}</div>
      <div class="l">${esc(s.l)}</div>
      <div class="p">${esc(s.p)}</div>
      <div class="vpista"><span style="width:${100 * s.v / max}%"></span></div>
    </div>`).join('');
  const etapas = NIVELES.map(k => ({k, v: n[k] || 0}));
  const apilada = etapas.filter(e => e.v).map(e => `<span style="flex:${e.v} 0 4px;background:var(--n-${e.k})"
      data-tip="${esc(`${NIVEL_TXT[e.k]}: ${nf.format(e.v)} · ${pctFino(e.v, t.total)}`)}"></span>`).join('');
  const resp = t.respondieron;
  return `<div class="card valida">
    <div class="vflujo">${flujo}</div>
    <div class="vetapas">
      <div class="vetapas-cab">
        <h3>Etapa en HubSpot de los ${nf.format(t.total)} contactos</h3>
        <span class="tag ${b.sin_avance ? 'warn clic-tag' : 'ok'}" ${b.sin_avance ? 'data-ir="brechas"' : ''}>${
          resp ? `${nf.format(b.sin_avance || 0)} de ${nf.format(resp)} que respondieron siguen sin Lead ni Deal` : 'Nadie ha respondido todavía'}</span>
      </div>
      <div class="vapilada">${apilada || '<span style="flex:1;background:var(--surf-cont-high)"></span>'}</div>
      <div class="vleyenda">${etapas.map(e => `<button class="vley ${e.v ? '' : 'cero'}" data-ir="${e.k}">
        <span class="dot" style="background:var(--n-${e.k})"></span>${NIVEL_TXT[e.k]}<b>${nf.format(e.v)}</b><span class="muted">${pctFino(e.v, t.total)}</span></button>`).join('')}</div>
    </div>
  </div>`;
}

// ── Secuencias creadas por cada seller ─────────────────────────────────────────
// Progreso por etapa (tareas de Amplemarket · amplemarket.py · progreso_por_etapa)
const TIPO_ETAPA = {
  email: ['mail', 'Correo'], linkedin_visit: ['visibility', 'LinkedIn · Visita al perfil'],
  linkedin_follow: ['person_add', 'LinkedIn · Seguir'], linkedin_like_last_post: ['thumb_up', 'LinkedIn · Like a la última publicación'],
  linkedin_connect: ['group_add', 'LinkedIn · Conexión'], linkedin_message: ['chat', 'LinkedIn · Mensaje'],
  linkedin_voice_message: ['mic', 'LinkedIn · Mensaje de voz'], linkedin_video_message: ['videocam', 'LinkedIn · Video'],
  phone_call: ['call', 'Llamada'], custom_task: ['task_alt', 'Tarea'], whatsapp: ['forum', 'WhatsApp'], sms: ['sms', 'SMS'],
};
const COL_ETAPA = [['programadas', 'Programadas', 'event_upcoming'], ['completadas', 'Completadas', 'check'],
                   ['saltadas', 'Saltadas', 'fast_forward'], ['canceladas', 'Canceladas', 'delete'], ['pausadas', 'Pausadas', 'pause']];
const SEC_ABIERTAS = new Set(), SEC_USUARIO = {};
const tipoEtapa = t => TIPO_ETAPA[t] || ['radio_button_unchecked', t];

function etapasHtml(s) {
  if (!s.etapas) return `<p class="muted small" style="margin:0">Todavía no hay progreso por etapa de esta secuencia: aparece con la próxima sincronización.</p>`;
  const nombres = Object.fromEntries(equipo().map(x => [x.email, x.nombre]));
  const usuarios = [...new Set(s.etapas.flatMap(e => Object.keys(e.por_usuario || {})))].sort();
  const u = usuarios.includes(SEC_USUARIO[s.id]) ? SEC_USUARIO[s.id] : '';
  const cols = COL_ETAPA.filter(([k]) => k !== 'pausadas' || s.etapas.some(e => e.pausadas));
  const repetido = t => s.etapas.filter(e => e.tipo === t).length > 1;
  const filas = s.etapas.map((e, i) => {
    const v = u ? (e.por_usuario[u] || {}) : e, [ico, txt] = tipoEtapa(e.tipo);
    return `<tr><td class="num muted" style="text-align:left">${i + 1}</td>
      <td><span class="etapa-tipo"><span class="ms">${ico}</span>${esc(txt)}${repetido(e.tipo) ? ` <span class="muted">· ${e.n}.ª</span>` : ''}
        <span class="tag" style="margin-left:4px">${e.automatica ? 'automática' : 'manual'}</span></span></td>
      ${cols.map(([k]) => `<td class="num ${v[k] ? '' : 'muted'}">${nf.format(v[k] || 0)}</td>`).join('')}</tr>`;
  }).join('');
  const pasos = (s.pasos_leads || []).map(p =>
    `<span class="tag" style="margin-left:0">${nf.format(p.leads)} en paso ${esc(p.paso)} · ${esc(tipoEtapa(p.tipo)[1])}</span>`).join(' ');
  return `
    ${usuarios.length > 1 ? `<div class="chips" style="margin-bottom:12px">
      ${[['', 'Todos los sellers'], ...usuarios.map(x => [x, nombres[x] || x])].map(([k, l]) =>
        `<button class="chip ${u === k ? 'on' : ''}" data-sec-usuario="${esc(k)}" data-sec="${esc(s.id)}">${u === k ? '<span class="ms">check</span>' : ''}${esc(l)}</button>`).join('')}</div>` : ''}
    ${s.etapas.length ? `<div class="etapas-caja"><table class="tabla sec-etapas"><thead><tr><th>#</th><th>Etapa</th>${cols.map(([, l, i]) =>
      `<th class="num"><span class="ms" style="font-size:16px;vertical-align:-3px">${i}</span> ${l}</th>`).join('')}</tr></thead><tbody>${filas}</tbody></table></div>`
      : '<p class="muted small" style="margin:0">Amplemarket todavía no ha creado tareas en esta secuencia.</p>'}
    ${pasos ? `<div class="small muted" style="margin-top:12px">Leads en curso hoy${u ? ' (todos los sellers)' : ''}: ${pasos}</div>` : ''}
    <div class="small muted" style="margin-top:8px">Tareas de Amplemarket de todos los usuarios de la secuencia, en el orden en que se crean.
      Los correos automáticos no son tareas: se ven en «Leads en curso hoy» mientras están programados.</div>`;
}

        <div class="dom">${s.creador ? 'creada por ' + esc(s.creador) : ''}${s.compartida ? ' · compartida, los leads se reparten por owner' : ''}</div></td>

    </tr>${SEC_ABIERTAS.has(s.id) ? `<tr class="sec-detalle"><td colspan="8">${etapasHtml(s)}</td></tr>` : ''}`;

  const filas = ss.map(s => {

      + secs.map(fila).join('');

      se excluyen los borradores de ejemplo de Amplemarket</span></h2>

      <th class="num">Leads</th><th class="num">Contactados</th><th class="num">Respondieron</th><th>Seguimiento</th></tr></thead>

function filasContactos() {
  const q = F.q.trim().toLowerCase(), filas = [];
  for (const b of basesSemana()) for (const e of b.empresas) for (const l of e.leads) {
    const t = l.hs_trat;
    if (!t) continue;
    if (F.nivel && t.nivel !== F.nivel) continue;
    if (F.brechas && !t.brechas.length) continue;
    if (F.trabajados && !t.trabajado) continue;
    if (q && !`${l.nombre} ${l.email} ${e.nombre} ${e.dominio}`.toLowerCase().includes(q)) continue;
    filas.push({b, e, l, t});
  }
  return filas.sort((x, y) => (y.t.brechas.length - x.t.brechas.length) || (y.t.trabajado - x.t.trabajado)
    || (NIVELES.indexOf(y.t.nivel) - NIVELES.indexOf(x.t.nivel)));
}

function filasEmpresas() {
  const q = F.q.trim().toLowerCase();
  const filas = [];
  for (const b of basesSemana()) {
    for (const e of b.empresas) {
      if (F.estado && e.estado !== F.estado) continue;
      if (F.alertas && !e.alertas.length) continue;
      if (q && !(`${e.nombre} ${e.dominio} ${e.leads.map(l => l.email + ' ' + l.nombre).join(' ')}`.toLowerCase().includes(q))) continue;
      filas.push({b, e});
    }
  }
  const val = {
    empresa: r => (r.e.nombre || '').toLowerCase(),
    rep: r => r.b.rep_nombre || '',
    estado: r => ORDEN.indexOf(r.e.estado),
    toques: r => r.e.actividades.length,
    primer: r => r.e.hitos.contactada || 'z',
    ultimo: r => r.e.dias_sin_toque,
    alertas: r => r.e.alertas.length,
  }[F.orden];
  return filas.sort((x, y) => (val(x) > val(y) ? 1 : val(x) < val(y) ? -1 : 0) * F.dir);
}

function sumar(bs) {
  const t = {empresas:0, contactos:0, en_hubspot:0, contactadas:0, respondieron:0, reuniones:0, deals:0, con_alertas:0, actividades:0, del_rep:0, por_estado:{}};
  for (const b of bs) for (const [k, v] of Object.entries(b.resumen)) {
    if (k === 'por_estado') for (const [s, n] of Object.entries(v)) t.por_estado[s] = (t.por_estado[s] || 0) + n;
    else if (typeof v === 'number') t[k] = (t[k] || 0) + v;
  }
  return t;
}

function resumenHtml(bs) {
  const t = sumar(bs);
  const claves = {'Empresas asignadas': 'total', 'En HubSpot': 'en_hubspot', 'Contactadas': 'contactadas', 'Respondieron': 'respondieron',

    <div class="l">${color ? `<span class="dot" style="background:var(--e-${color})"></span>` : ''}${l}</div>

const KPIS = {
  total: ['Empresas asignadas', e => true],
  en_hubspot: ['En HubSpot', e => e.estado !== 'no_en_hubspot'],
  contactadas: ['Contactadas', e => ORDEN.indexOf(e.estado) >= ORDEN.indexOf('contactada')],
  respondieron: ['Respondieron', e => ORDEN.indexOf(e.estado) >= ORDEN.indexOf('respondio')],
  reunion: ['Con reunión', e => ORDEN.indexOf(e.estado) >= ORDEN.indexOf('reunion')],
  deal: ['Con deal nuevo', e => e.estado === 'deal'],
  alertas: ['Con alertas', e => e.alertas.length > 0],
};

// Etapa del ciclo de vida en HubSpot: la de la empresa; si no tiene, la más avanzada de sus contactos
function etapaHs(e) {
  const nombres = D.etiquetas?.etapa || {};
  const orden = Object.keys(nombres);
  if (e.hubspot?.etapa) return {valor: e.hubspot.etapa, etiqueta: nombres[e.hubspot.etapa] || e.hubspot.etapa, origen: 'empresa'};
  const deContactos = e.leads.map(l => l.hs_etapa).filter(Boolean).sort((a, b) => orden.indexOf(b) - orden.indexOf(a));
  if (deContactos.length) return {valor: deContactos[0], etiqueta: nombres[deContactos[0]] || deContactos[0], origen: 'contacto'};
  return {valor: e.hubspot || e.leads.some(l => l.hs_id) ? '_sin_etapa' : '_no_hs',
          etiqueta: e.hubspot || e.leads.some(l => l.hs_id) ? 'Sin etapa' : 'No está en HubSpot', origen: null};
}
const leadStatusHs = e => {
  const v = e.hubspot?.lead_status || e.leads.map(l => l.hs_lead_status).find(Boolean);
  return v ? (D.etiquetas?.lead_status?.[v] || v) : null;
};

function desglose(kpi) {
  const [titulo, filtro] = KPIS[kpi];
  const orden = [...Object.keys(D.etiquetas?.etapa || {}), '_sin_etapa', '_no_hs'];
  // secuencia → rep → empresas (una empresa puede estar en dos secuencias si sus contactos lo están)
  const mapa = new Map();
  let total = 0;
  for (const b of basesSemana()) for (const e of b.empresas) {
    if (!filtro(e)) continue;
    total++;
    const secs = [...new Set(e.leads.map(l => l.am?.secuencia).filter(Boolean))];
    for (const s of (secs.length ? secs : [b.lista_nombre])) {
      if (!mapa.has(s)) mapa.set(s, new Map());

            <td>${esc(f.etapa.etiqueta)}${f.etapa.origen === 'contacto' ? ' <span class="tag">por contacto</span>' : ''}</td>

            <td>${esc(f.e.hubspot?.owner || '—')}</td></tr>`).join('')}

  $('#panel').innerHTML = `<div class="velo"></div><aside style="width:min(980px,100vw)">
    <button class="btn cerrar" id="cerrar"><span class="ms">close</span></button>
    <div class="sub">Semana ${basesSemana()[0]?.semana} · clic en un rep para ver sus empresas, clic en una empresa para su detalle</div>

    const filas = mapa.get(tr.dataset.sec).get(tr.dataset.rep)
      .sort((x, y) => orden.indexOf(x.etapa.valor) - orden.indexOf(y.etapa.valor));

function amResumen(e) {
  const a = e.amplemarket;
  if (!a) return '<span class="muted">—</span>';
  const partes = [`${a.contactados}/${a.leads} contactados`];
  if (a.por_iniciar) partes.push(`${a.por_iniciar} por iniciar`);
  if (a.respondieron) partes.push(`${a.respondieron} respondió`);
  if (a.aperturas) partes.push(`${a.aperturas} aperturas`);
  return `<span class="dom">${partes.join(' · ')}</span>${a.rebotados ? `<span class="tag warn">${a.rebotados} rebote${a.rebotados > 1 ? 's' : ''}</span>` : ''}`;
}

async function sincronizar() {
  seguir(await (await fetch('/api/sincronizar', {method: 'POST'})).json());
}

// Sigue una sincronización (manual o la automática diaria) hasta que termine
async function seguir(s) {
  PROGRAMACION = s.programacion ?? PROGRAMACION;
  $('#sync').disabled = s.corriendo;
  if (s.corriendo) $('#errores').innerHTML = '';
  while (s.corriendo) {
    $('#progreso').textContent = (s.origen === 'automática' ? 'Actualización diaria · ' : '') + (s.mensajes.at(-1) || 'Arrancando…');
    await new Promise(r => setTimeout(r, 1500));
    s = await (await fetch('/api/sincronizar')).json();
  }
  $('#progreso').textContent = '';
  $('#sync').disabled = false;
  if (s.error) $('#errores').innerHTML = `<div class="error"><b>La sincronización ${s.origen === 'automática' ? 'automática ' : ''}falló${
    s.fin ? ' (' + fechaHora(s.fin) + ')' : ''}:</b> ${esc(s.error)}</div>`;
  await cargar();
}

function semanaIso(s) {
  const d = new Date(s); d.setUTCHours(0, 0, 0, 0);
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  const anio = d.getUTCFullYear();
  return {anio, semana: Math.ceil(((d - Date.UTC(anio, 0, 1)) / 864e5 + 1) / 7)};
}

$('#sync').onclick = sincronizar;
$('#exportar').onclick = exportar;
// Recargar: trae el último dato guardado (en Vercel, la última foto publicada) sin sincronizar
$('#recargar').onclick = async () => {
  const btn = $('#recargar');
  btn.disabled = true;
  HIST = null;
  try { await cargar(); } finally { btn.disabled = false; }
};
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#panel').innerHTML = ''; });
let PROGRAMACION = null;
if (ESTATICO) {
  $('#sync').remove(); $('#btn-secuencias').remove();
  cargar();
} else {
fetch('/api/sincronizar').then(r => r.json()).then(seguir);
// la actualización diaria corre en el servidor; si la página queda abierta, se refresca sola
setInterval(async () => { const s = await (await fetch('/api/sincronizar')).json(); if (s.corriendo && !$('#sync').disabled) seguir(s); }, 60000);
}
</script>
</body>
</html>
